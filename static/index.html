<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nook — AI Marketing Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ── Sidebar ─────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-name">Nook</span>
            <span class="logo-tagline">AI Marketing Studio</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Campaign Flow</div>
        <div class="step-list" id="step-list">
          <div class="step-item active" data-stage="INTAKE" id="step-INTAKE">
            <div class="step-icon-wrap"><div class="step-icon">1</div></div>
            <div class="step-info">
              <span class="step-title">Brief</span>
              <span class="step-sub">6 quick questions</span>
            </div>
            <div class="step-status-dot"></div>
          </div>
          <div class="step-connector-line"></div>
          <div class="step-item" data-stage="DONE" id="step-DONE">
            <div class="step-icon-wrap"><div class="step-icon">2</div></div>
            <div class="step-info">
              <span class="step-title">Campaign</span>
              <span class="step-sub">Full content package</span>
            </div>
            <div class="step-status-dot"></div>
          </div>
        </div>
      </nav>

      <div class="sidebar-actions">
        <button id="btn-new" class="btn-new-campaign" title="Start a new campaign">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New Campaign
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="powered-badge">
          <span class="powered-dot"></span>
          Powered by IBM watsonx
        </div>
      </div>
    </aside>

    <!-- ── Main content ─────────────────────────────────────────────── -->
    <main class="main-panel">

      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title" id="topbar-title">New Campaign</h1>
          <span class="topbar-badge" id="topbar-badge">Brief</span>
        </div>
        <div class="topbar-right">
          <div class="progress-wrap" id="progress-wrap">
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <span class="progress-label" id="progress-label">0 of 6</span>
          </div>
        </div>
      </header>

      <!-- Error banner -->
      <div id="error-banner" class="error-banner hidden" role="alert">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <span id="error-text" class="error-text"></span>
        <button id="btn-retry" class="btn-retry hidden">↺ Retry</button>
        <button id="btn-dismiss-error" class="btn-dismiss" aria-label="Dismiss">✕</button>
      </div>

      <!-- Chat / Campaign area -->
      <div class="content-area" id="content-area">

        <!-- Chat log (shown during INTAKE) -->
        <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>

        <!-- Campaign output (shown when DONE) -->
        <div id="campaign-output" class="campaign-output hidden"></div>

      </div>

      <!-- Typing indicator -->
      <div id="typing" class="typing-indicator hidden" aria-label="Nook is thinking">
        <div class="typing-bubble">
          <span></span><span></span><span></span>
        </div>
        <span class="typing-text">Generating your campaign…</span>
      </div>

      <!-- Input form (hidden when campaign is shown) -->
      <footer class="input-footer" id="input-footer">
        <form id="chat-form" class="chat-form" autocomplete="off">
          <div class="input-wrap">
            <input
              id="chat-input"
              type="text"
              placeholder="Type your answer…"
              autocomplete="off"
              aria-label="Message"
            />
            <button type="submit" id="btn-send" class="btn-send" aria-label="Send">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 10L16.5 3.5L11 10L16.5 16.5L3 10Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <p class="input-hint" id="input-hint">Press Enter to send</p>
        </form>
      </footer>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
